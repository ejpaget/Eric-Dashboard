name: Update dashboard news

on:
  schedule:
    # GitHub schedules use UTC. This runs at 10 and 40 minutes past each hour.
    - cron: "10,40 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Download the dashboard repository
        uses: actions/checkout@v4

      - name: Collect current RSS stories
        run: python scripts/update_news.py

      - name: Save updated stories when they change
        run: |
          if git diff --quiet -- news.json; then
            echo "News is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update dashboard news"
          git push
